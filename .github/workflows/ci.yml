name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: screencapturekit-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: screencapturekit-rs
          persist-credentials: false
      - run: rustc --version
      - run: swift --version && xcodebuild -version
      - run: cargo build --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features -- --skip test_async_screenshot_capture_ --skip test_async_shareable_content_above_ --skip test_async_shareable_content_below_ --skip test_async_shareable_content_with_ --skip test_async_stream_buffer_ --skip test_async_stream_capture_ --skip test_async_stream_clear_ --skip test_async_stream_creation --skip test_async_stream_frames_ --skip test_async_stream_is_ --skip test_async_stream_multi_ --skip test_async_stream_multiple_ --skip test_async_stream_next_ --skip test_async_stream_start_ --skip test_async_stream_take_ --skip test_async_stream_update_ --skip test_async_stream_with_ --skip test_audio_capture --skip test_capture_image --skip test_capture_sample_ --skip test_capture_screenshot_ --skip test_cgimage_bgra_ --skip test_cgimage_data_ --skip test_cgimage_rgba_ --skip test_clean_ --skip test_clone_ --skip test_closure_ --skip test_combined_ --skip test_content_filter_builder_ --skip test_content_filter_clone --skip test_content_filter_content_ --skip test_content_filter_debug_ --skip test_content_filter_equality --skip test_content_filter_exclude_ --skip test_content_filter_hash --skip test_content_filter_include_ --skip test_content_filter_included_ --skip test_content_filter_memory --skip test_content_filter_point_ --skip test_content_filter_style --skip test_content_info_ --skip test_extra_ --skip test_handler_add_ --skip test_handler_registration_ --skip test_iosurface_backed_ --skip test_live_ --skip test_multiple_streams_ --skip test_next_sample_after_ --skip test_next_sample_future_ --skip test_pixel_buffer_locking --skip test_presenter_overlay_content_ --skip test_remove_ --skip test_restart_ --skip test_screen_ --skip test_screenshot_capture_ --skip test_shareable_content_above_ --skip test_shareable_content_below_ --skip test_shareable_content_drop --skip test_shareable_content_info_clone --skip test_shareable_content_info_debug --skip test_shareable_content_info_display --skip test_shareable_content_info_for_ --skip test_shareable_content_info_pixel_ --skip test_stream_clone --skip test_stream_creation --skip test_stream_debug_ --skip test_stream_different_ --skip test_stream_identity_is_ --skip test_stream_lifecycle --skip test_stream_multiple_ --skip test_stream_update_ --skip test_stream_with_ --skip test_two_ --skip test_video_and_ --skip test_video_capture --skip test_window_ --skip test_yuv_
      - run: cargo doc --no-deps --all-features
